services:
  - type: web
    name: simha-ai-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MONGO_URL
        sync: false
      - key: DATABASE_NAME
        sync: false
      - key: GROQ_API_KEY
        sync: false
