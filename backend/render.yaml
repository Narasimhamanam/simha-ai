services:
  - type: web
    name: astra-ai-backend
    env: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --timeout-keep-alive 75
    envVars:
      - key: MONGO_URL
        sync: false
      - key: DATABASE_NAME
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: CASHFREE_CLIENT_ID
        sync: false
      - key: CASHFREE_CLIENT_SECRET
        sync: false
      - key: CASHFREE_ENVIRONMENT
        value: sandbox
      - key: CASHFREE_API_VERSION
        value: 2023-08-01
      - key: ADMIN_EMAILS
        sync: false
      - key: BACKEND_URL
        # Set to your actual backend Render URL, e.g. https://astra-ai-backend.onrender.com
        sync: false
      - key: FRONTEND_URL
        # Set to your actual frontend Render URL, e.g. https://gpt-6-astra.onrender.com
        sync: false
      - key: ALLOWED_ORIGINS
        # Comma-separated list: https://gpt-6-astra.onrender.com,http://localhost:5173
        sync: false
      - key: FREE_DAILY_MESSAGES
        value: "10"
      - key: PREMIUM_DAILY_MESSAGES
        value: "100"
      - key: FREE_DAILY_DOCUMENTS
        value: "2"
      - key: PREMIUM_DAILY_DOCUMENTS
        value: "20"
      - key: MAX_DOCUMENT_SIZE_MB
        value: "30"
      - key: MAX_IMAGE_SIZE_MB
        value: "20"
      - key: MAX_REQUESTS_PER_MINUTE
        value: "30"
