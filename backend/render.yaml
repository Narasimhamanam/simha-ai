services:
  - type: web
    name: astra-ai-backend
    env: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --timeout-keep-alive 75
    envVars:
      - key: MONGO_URL
        sync: false
      - key: DATABASE_NAME
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: PHONEPE_MERCHANT_ID
        sync: false
      - key: PHONEPE_SALT_KEY
        sync: false
      - key: PHONEPE_SALT_INDEX
        sync: false
      - key: PHONEPE_ENV
        value: UAT
      - key: ADMIN_EMAILS
        sync: false
      - key: FRONTEND_URL
        sync: false
