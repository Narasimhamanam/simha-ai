<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" fill="none">
  <defs>
    <!-- Primary Electric Cyan to Royal Indigo -->
    <linearGradient id="astraGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <!-- Neural Core Radial Glow -->
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="1"/>
      <stop offset="60%" stop-color="#6366F1" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0B0F17" stop-opacity="0"/>
    </radialGradient>
    <!-- Dark background gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0B0F17"/>
    </radialGradient>
    <!-- Subtle glow filter -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect width="48" height="48" rx="12" fill="url(#bgGrad)"/>
  <rect width="48" height="48" rx="12" fill="none" stroke="url(#astraGrad)" stroke-width="1" opacity="0.4"/>

  <!-- Outer dashed orbit ring -->
  <circle cx="24" cy="24" r="19" stroke="url(#astraGrad)" stroke-width="0.8" stroke-dasharray="3.5 2.5" opacity="0.4"/>

  <!-- Four-Point Quantum Star (Astra emblem) -->
  <path
    d="M24 4L27.2 18.8L42 22L27.2 25.2L24 40L20.8 25.2L6 22L20.8 18.8L24 4Z"
    fill="url(#astraGrad)"
    filter="url(#glow)"
    opacity="0.92"
  />

  <!-- Diamond inner cutout (dark) -->
  <polygon points="24,11 31,22 24,33 17,22" fill="#0B0F17" opacity="0.85"/>

  <!-- Pulsing cognitive core -->
  <circle cx="24" cy="22" r="4" fill="url(#coreGlow)"/>
  <circle cx="24" cy="22" r="1.8" fill="#FFFFFF"/>

  <!-- Cardinal stellar nodes -->
  <circle cx="24" cy="4.5" r="1.4" fill="#00F0FF"/>
  <circle cx="41.5" cy="22" r="1.4" fill="#38BDF8"/>
  <circle cx="24" cy="39.5" r="1.4" fill="#6366F1"/>
  <circle cx="6.5" cy="22" r="1.4" fill="#818CF8"/>
</svg>